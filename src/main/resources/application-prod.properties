# Produccion (Railway u otro hosting)
# Configuracion de conexion cifrada (TLS) por defecto para entornos cloud
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=${MYSQL_USE_SSL:true}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY:false}&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.show-sql=false
